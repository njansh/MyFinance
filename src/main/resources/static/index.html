<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>MyFinance Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
<div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">MyFinance</h1>
        <div class="space-x-2">
            <button onclick="openModal('modal-account')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+ Conta</button>
            <button onclick="openModal('modal-transaction')" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">+ Transação</button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
            <h2 class="text-gray-500 text-xs uppercase font-bold">Saldo Consolidado</h2>
            <p id="total-balance" class="text-3xl font-bold text-gray-800">R$ 0,00</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Minhas Contas</h2>
            <div id="accounts-list" class="space-y-3"></div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Categorias</h2>
            <div id="categories-list" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<div id="modal-account" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-md">
        <h2 class="text-xl font-bold mb-4">Nova Conta</h2>
        <form id="form-account" class="space-y-4">
            <input type="text" id="acc-name" placeholder="Nome da Conta (ex: Santander)" class="w-full border p-2 rounded" required>
            <select id="acc-type" class="w-full border p-2 rounded">
                <option value="CHECKING">Corrente</option>
                <option value="SAVINGS">Poupança</option>
                <option value="INVESTMENT">Investimento</option>
            </select>
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="closeModal('modal-account')" class="text-gray-500">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Salvar</button>
            </div>
        </form>
    </div>
</div>

<div id="modal-transaction" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-md">
        <h2 class="text-xl font-bold mb-4">Nova Transação</h2>
        <form id="form-transaction" class="space-y-4">
            <select id="trans-account" class="w-full border p-2 rounded" required></select>
            <select id="trans-category" class="w-full border p-2 rounded" required></select>
            <input type="number" id="trans-amount" step="0.01" placeholder="Valor (ex: 50.00)" class="w-full border p-2 rounded" required>
            <input type="text" id="trans-desc" placeholder="Descrição" class="w-full border p-2 rounded" required>
            <select id="trans-type" class="w-full border p-2 rounded">
                <option value="EXPENSE">Despesa</option>
                <option value="INCOME">Receita</option>
            </select>
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="closeModal('modal-transaction')" class="text-gray-500">Cancelar</button>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Confirmar</button>
            </div>
        </form>
    </div>
</div>

<script>
    const userId = 'feb6ff14-69c9-4e37-9d00-5ddc3de685a8'; // ID do Nadson
    const API_BASE = 'http://localhost:8080';

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function loadDashboard() {
        // Carregar Saldo
        const resBalance = await fetch(`${API_BASE}/users/${userId}/total-balance`);
        const balance = await resBalance.json();
        document.getElementById('total-balance').innerText = `R$ ${balance.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

        // Carregar Contas
        const resAcc = await fetch(`${API_BASE}/users/${userId}/accounts`);
        const accounts = await resAcc.json();
        const listAcc = document.getElementById('accounts-list');
        const selectAcc = document.getElementById('trans-account');

        listAcc.innerHTML = '';
        selectAcc.innerHTML = '<option value="">Selecione a conta</option>';

        accounts.forEach(acc => {
            listAcc.innerHTML += `
                <div class="flex justify-between p-3 bg-gray-50 rounded-lg">
                    <span>${acc.name}</span>
                    <span class="font-bold ${acc.balance < 0 ? 'text-red-500' : 'text-green-600'}">R$ ${acc.balance.toLocaleString('pt-BR')}</span>
                </div>`;
            selectAcc.innerHTML += `<option value="${acc.accountId}">${acc.name}</option>`;
        });

        // Carregar Categorias
        const resCat = await fetch(`${API_BASE}/categories`);
        const categories = await resCat.json();
        const listCat = document.getElementById('categories-list');
        const selectCat = document.getElementById('trans-category');

        listCat.innerHTML = '';
        selectCat.innerHTML = '<option value="">Selecione a categoria</option>';

        categories.forEach(cat => {
            listCat.innerHTML += `<span class="px-3 py-1 rounded-full text-white text-xs" style="background-color: ${cat.colorHex}">${cat.name}</span>`;
            selectCat.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
        });
    }

    // SALVAR CONTA
    document.getElementById('form-account').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('acc-name').value,
            type: document.getElementById('acc-type').value,
            userId: userId // Seu CreateAccountUseCase espera o userId
        };

        await fetch(`${API_BASE}/accounts`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        closeModal('modal-account');
        loadDashboard();
    };

    // SALVAR TRANSAÇÃO
    document.getElementById('form-transaction').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            accountId: document.getElementById('trans-account').value,
            categoryId: document.getElementById('trans-category').value,
            amount: parseFloat(document.getElementById('trans-amount').value),
            description: document.getElementById('trans-desc').value,
            type: document.getElementById('trans-type').value,
            date: new Date().toISOString()
        };

        await fetch(`${API_BASE}/transactions`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        closeModal('modal-transaction');
        loadDashboard();
    };

    loadDashboard();
</script>
</body>
</html>
