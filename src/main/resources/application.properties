spring.application.name=MyFinance
spring.datasource.url=jdbc:postgresql://localhost:5432/myfinance?sslmode=disable
spring.datasource.username=nadson
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# DESATIVAR o DDL-Auto para proteger a integridade dos dados na producao
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuracao do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0